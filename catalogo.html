<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Camisas e Moda Esportiva | Liming Store</title>
  <meta name="description" content="Filtre por categoria, clube, seleção, tamanho e preço. Camisas de futebol, retrô, casacos e agasalhos com frete para todo o Brasil.">
  <link rel="canonical" href="https://SEU-USUARIO.github.io/liming-store/catalogo.html">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-pagina="catalogo">
  <div id="barra-superior"></div>
  <div id="cabecalho"></div>

  <main>
    <div class="pagina-topo">
      <div class="container">
        <nav class="migalhas" aria-label="Você está em"><a href="index.html">Início</a> / <span>Catálogo</span></nav>
        <h1 class="titulo-lg" id="catalogo-titulo">Todos os produtos</h1>
      </div>
    </div>

    <div class="container catalogo">
      <!-- FILTROS -->
      <aside class="filtros" id="filtros" aria-label="Filtros">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 class="titulo-md">Filtrar</h2>
          <button class="link-ver-tudo" id="limpar-todos" type="button" style="background:none">Limpar</button>
        </div>
        <div class="filtro"><h3>Categoria</h3><div id="f-categorias"></div></div>
        <div class="filtro"><h3>Clube / Seleção / Linha</h3><div id="f-grupos"></div></div>
        <div class="filtro"><h3>Tamanho</h3><div class="tamanhos-filtro" id="f-tamanhos"></div></div>
        <div class="filtro"><h3>Preço (R$)</h3>
          <div class="faixa-preco">
            <input id="f-min" type="number" min="0" inputmode="numeric" placeholder="Mín." aria-label="Preço mínimo">
            <input id="f-max" type="number" min="0" inputmode="numeric" placeholder="Máx." aria-label="Preço máximo">
          </div></div>
        <button class="btn btn--primario btn-filtros-mobile" id="fechar-filtros" type="button">Ver resultados</button>
      </aside>

      <!-- LISTA -->
      <section aria-label="Produtos">
        <div class="catalogo__barra">
          <div style="display:flex;gap:12px;align-items:center">
            <button class="btn btn--contorno btn--sm btn-filtros-mobile" id="abrir-filtros" type="button">Filtros</button>
            <span class="texto-pequeno" id="catalogo-contagem" aria-live="polite"></span>
          </div>
          <label class="sr-only" for="ordem">Ordenar por</label>
          <select id="ordem">
            <option value="relevancia">Relevância</option>
            <option value="vendidos">Mais vendidos</option>
            <option value="novidades">Novidades</option>
            <option value="menor">Menor preço</option>
            <option value="maior">Maior preço</option>
          </select>
        </div>
        <div class="grade-produtos" id="catalogo-grade"></div>
      </section>
    </div>
  </main>

  <div id="rodape"></div>

  <script src="js/config/loja.config.js"></script>
  <script src="js/dados/categorias.js"></script>
  <script src="js/dados/produtos.js"></script>
  <script src="js/nucleo/utils.js"></script>
  <script src="js/nucleo/armazenamento.js"></script>
  <script src="js/nucleo/arte-produto.js"></script>
  <script src="js/nucleo/carrinho.js"></script>
  <script src="js/nucleo/favoritos.js"></script>
  <script src="js/nucleo/ui.js"></script>
  <script src="js/nucleo/card-produto.js"></script>
  <script src="js/nucleo/gaveta.js"></script>
  <script src="js/nucleo/layout.js"></script>
  <script src="js/paginas/catalogo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
