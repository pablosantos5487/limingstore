<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato e Atendimento | Liming Store</title>
  <meta name="description" content="Fale com a Liming Store pelo WhatsApp, e-mail ou formulário. Atendimento para dúvidas, pedidos, trocas e devoluções.">
  <link rel="canonical" href="https://SEU-USUARIO.github.io/liming-store/contato.html">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-pagina="contato">
  <div id="barra-superior"></div>
  <div id="cabecalho"></div>

  <main>
    <div class="pagina-topo"><div class="container">
      <nav class="migalhas" aria-label="Você está em"><a href="index.html">Início</a> / <span>Contato</span></nav>
      <h1 class="titulo-lg">Fale com a gente</h1>
    </div></div>
    <div class="container contato">
      <div class="contato__canais">
        <a class="canal" id="canal-whats" href="#" target="_blank" rel="noopener"><span style="font-size:1.6rem">💬</span><div><b>WhatsApp</b><span>Atendimento mais rápido</span></div></a>
        <a class="canal" id="canal-email" href="#"><span style="font-size:1.6rem">✉️</span><div><b>E-mail</b><span id="canal-email-txt"></span></div></a>
        <a class="canal" id="canal-insta" href="#" target="_blank" rel="noopener"><span style="font-size:1.6rem">📸</span><div><b>Instagram</b><span>Novidades e bastidores</span></div></a>
        <p class="texto-pequeno" id="canal-horario"></p>
      </div>
      <form id="form-contato" novalidate>
        <div class="form-grade">
          <div class="campo"><label for="c-nome">Nome</label><input id="c-nome" autocomplete="name"></div>
          <div class="campo"><label for="c-email">E-mail</label><input id="c-email" type="email" autocomplete="email"></div>
          <div class="campo largo"><label for="c-assunto">Assunto</label>
            <select id="c-assunto"><option>Dúvida sobre produto</option><option>Acompanhar pedido</option><option>Troca ou devolução</option><option>Parcerias</option><option>Outro</option></select></div>
          <div class="campo largo"><label for="c-msg">Mensagem</label><textarea id="c-msg"></textarea></div>
          <input id="c-honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
          <div class="campo largo"><label style="text-transform:none;font-weight:500;display:flex;gap:10px;align-items:flex-start">
            <input id="c-aceite" type="checkbox" style="width:auto;margin-top:4px;accent-color:var(--destaque)"> <span>Aceito a <a href="politicas.html#privacidade" target="_blank" style="color:var(--destaque);text-decoration:underline">política de privacidade</a>.</span></label></div>
        </div>
        <button class="btn btn--primario mt-3" id="c-enviar" type="submit">Enviar mensagem</button>
        <div class="oculto" id="contato-aviso" role="status"></div>
      </form>
    </div>
  </main>

  <div id="rodape"></div>

  <script src="js/config/loja.config.js"></script>
  <script src="js/dados/categorias.js"></script>
  <script src="js/dados/produtos.js"></script>
  <script src="js/nucleo/utils.js"></script>
  <script src="js/nucleo/armazenamento.js"></script>
  <script src="js/nucleo/arte-produto.js"></script>
  <script src="js/nucleo/carrinho.js"></script>
  <script src="js/nucleo/favoritos.js"></script>
  <script src="js/nucleo/ui.js"></script>
  <script src="js/nucleo/card-produto.js"></script>
  <script src="js/nucleo/gaveta.js"></script>
  <script src="js/nucleo/layout.js"></script>
  <script src="js/paginas/contato.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
