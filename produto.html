<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto | Liming Store</title>
  <meta name="description" content="Detalhes do produto na Liming Store.">
  <link rel="canonical" href="https://SEU-USUARIO.github.io/liming-store/produto.html">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body data-pagina="produto">
  <div id="barra-superior"></div>
  <div id="cabecalho"></div>

  <main>
    <div class="container">
      <nav class="migalhas" style="padding-top:24px" aria-label="Você está em">
        <a href="index.html">Início</a> / <a id="migalha-categoria" href="catalogo.html">Produtos</a> / <span id="migalha-produto"></span>
      </nav>

      <div class="produto" id="produto-raiz">
        <!-- GALERIA -->
        <div class="galeria">
          <div class="galeria__miniaturas" id="galeria-mini"></div>
          <div class="galeria__principal" id="galeria-principal" role="button" tabindex="0" aria-label="Ampliar imagem"></div>
        </div>

        <!-- INFORMAÇÕES -->
        <div class="produto__info">
          <p class="sobretitulo" id="produto-grupo"></p>
          <h1 class="titulo-lg" id="produto-nome"></h1>
          <div class="produto__precos" id="produto-precos"></div>
          <p class="produto__parcelas" id="produto-parcelas"></p>

          <div class="bloco-opcao">
            <div class="bloco-opcao__topo"><span>Tamanho</span><button type="button" id="abrir-tabela">Tabela de tamanhos</button></div>
            <div class="tamanhos" id="tamanhos" role="group" aria-label="Escolha o tamanho"></div>
            <p class="erro-tamanho" id="erro-tamanho" role="alert"></p>
            <p class="estoque-info" id="estoque-info" aria-live="polite"></p>
          </div>

          <div class="produto__compra">
            <div class="qtd" role="group" aria-label="Quantidade">
              <button type="button" id="qtd-menos" aria-label="Diminuir">−</button><span id="qtd-valor">1</span><button type="button" id="qtd-mais" aria-label="Aumentar">+</button>
            </div>
            <button class="btn btn--contorno" type="button" id="btn-adicionar">Adicionar ao carrinho</button>
            <button class="btn btn--primario btn--comprar" type="button" id="btn-comprar">Comprar agora</button>
          </div>

          <div class="entrega-bloco">
            <div><span>🚚</span><span><b>Entrega para todo o Brasil.</b> <span id="info-frete-gratis"></span></span></div>
            <form id="form-cep" class="mini-form" novalidate>
              <input id="cep-produto" inputmode="numeric" maxlength="9" placeholder="Digite seu CEP" aria-label="CEP">
              <button type="submit">Calcular</button>
            </form>
            <p class="texto-pequeno" id="cep-resultado" aria-live="polite"></p>
          </div>

          <div class="descricao">
            <h2>Descrição</h2>
            <p id="produto-descricao"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- PRODUTOS RELACIONADOS -->
    <section class="secao" style="background:var(--g-900)" id="relacionados-secao">
      <div class="container">
        <div class="secao-cabeca"><div><p class="sobretitulo">Combina com</p><h2 class="titulo-lg">Produtos relacionados</h2></div></div>
        <div class="grade-produtos" id="relacionados"></div>
      </div>
    </section>
  </main>

  <!-- Zoom e tabela de tamanhos -->
  <div class="zoom" id="zoom" role="dialog" aria-label="Imagem ampliada"></div>
  <div class="modal-tabela" id="modal-tabela">
    <div class="modal-tabela__caixa">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 class="titulo-md">Tabela de tamanhos</h2><button class="link-ver-tudo" data-fechar type="button" style="background:none">Fechar</button></div>
      <div id="tabela-corpo"></div>
    </div>
  </div>

  <div id="rodape"></div>

  <script src="js/config/loja.config.js"></script>
  <script src="js/dados/categorias.js"></script>
  <script src="js/dados/produtos.js"></script>
  <script src="js/nucleo/utils.js"></script>
  <script src="js/nucleo/armazenamento.js"></script>
  <script src="js/nucleo/arte-produto.js"></script>
  <script src="js/nucleo/carrinho.js"></script>
  <script src="js/nucleo/favoritos.js"></script>
  <script src="js/nucleo/ui.js"></script>
  <script src="js/nucleo/card-produto.js"></script>
  <script src="js/nucleo/gaveta.js"></script>
  <script src="js/nucleo/layout.js"></script>
  <script src="js/paginas/produto.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
